name: Build and Release MicaPDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build x64 Release
      run: dotnet publish -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true
      
    - name: Build ARM64 Release
      run: dotnet publish -c Release -r win-arm64 -p:Platform=ARM64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true
      
    - name: Create Release Folder
      run: |
        New-Item -ItemType Directory -Force -Path "Release"
      shell: pwsh
      
    - name: Create Installation Instructions
      run: |
        @"
        MicaPDF
        =======

        Installation

        1. Download the build for your system:
           - MicaPDF-Setup-x64.exe or MicaPDF-Portable-x64.zip
           - MicaPDF-Setup-ARM64.exe or MicaPDF-Portable-ARM64.zip

        2. Run the installer or the portable executable.

        3. Optionally set MicaPDF as the default PDF reader when prompted.

        Basics
        - Open PDFs from the menu or by drag-and-drop
        - Edit mode: pen, highlighter, text, eraser
        - Save annotated PDF writes a new PDF with your annotations

        Requirements
        - Windows 10 version 1809 (build 17763) or later
        - .NET Desktop Runtime 10.0 (installer prompts if missing)

        "@ | Out-File -FilePath "Release\INSTALL.txt" -Encoding UTF8
      shell: pwsh
      
    - name: Create README
      run: |
        @"
        # MicaPDF

        PDF viewer for Windows with Mica backdrop, zoom/navigation, and ink/text annotations.

        ## Features

        - Mica backdrop (WinUI 3)
        - PDF rendering with zoom and page modes
        - Pen, highlighter, text, and eraser
        - Save annotated PDF
        - Drag and drop; optional default PDF association
        - English and Italian

        ## Requirements

        - Windows 10 (build 17763) or later

        ## Download

        See the [Releases](../../releases) page.

        ## Building from source

        ``````bash
        git clone https://github.com/TCDev69/MicaPDF.git
        cd MicaPDF
        dotnet build -p:Platform=x64
        ``````

        ## License

        GNU General Public License v3.0 (GPLv3). See LICENSE.

        "@ | Out-File -FilePath "Release\README.md" -Encoding UTF8
      shell: pwsh
      
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: pwsh
      
    - name: Create x64 Installer Script
      run: |
        @"
        #define MyAppName "MicaPDF"
        #define MyAppVersion "1.3.0"
        #define MyAppPublisher "TCDev"
        #define MyAppURL "https://github.com/TCDev69/MicaPDF"
        #define MyAppExeName "MicaPDF.exe"

        [Setup]
        AppId={{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
        AppName={#MyAppName}
        AppVersion={#MyAppVersion}
        AppPublisher={#MyAppPublisher}
        AppPublisherURL={#MyAppURL}
        AppSupportURL={#MyAppURL}
        AppUpdatesURL={#MyAppURL}
        DefaultDirName={autopf}\{#MyAppName}
        DefaultGroupName={#MyAppName}
        AllowNoIcons=yes
        OutputDir=Release
        OutputBaseFilename=MicaPDF-Setup-x64
        Compression=lzma2
        SolidCompression=yes
        WizardStyle=modern
        ArchitecturesAllowed=x64
        ArchitecturesInstallIn64BitMode=x64
        PrivilegesRequired=lowest

        [Languages]
        Name: "english"; MessagesFile: "compiler:Default.isl"

        [Tasks]
        Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

        [Files]
        Source: "bin\x64\Release\net10.0-windows10.0.22621.0\win-x64\publish\MicaPDF.exe"; DestDir: "{app}"; Flags: ignoreversion

        [Icons]
        Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
        Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
        Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

        [Run]
        Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent

        [Registry]
        Root: HKCU; Subkey: "Software\Classes\.pdf"; ValueType: string; ValueName: ""; ValueData: "MicaPDF.Document"; Flags: uninsdeletevalue
        Root: HKCU; Subkey: "Software\Classes\MicaPDF.Document"; ValueType: string; ValueName: ""; ValueData: "PDF Document"; Flags: uninsdeletekey
        Root: HKCU; Subkey: "Software\Classes\MicaPDF.Document\DefaultIcon"; ValueType: string; ValueName: ""; ValueData: "{app}\{#MyAppExeName},0"
        Root: HKCU; Subkey: "Software\Classes\MicaPDF.Document\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\{#MyAppExeName}"" ""%1"""
        "@ | Out-File -FilePath "installer-x64.iss" -Encoding UTF8
      shell: pwsh
      
    - name: Create ARM64 Installer Script
      run: |
        @"
        #define MyAppName "MicaPDF"
        #define MyAppVersion "1.3.0"
        #define MyAppPublisher "TCDev"
        #define MyAppURL "https://github.com/TCDev69/MicaPDF"
        #define MyAppExeName "MicaPDF.exe"

        [Setup]
        AppId={{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
        AppName={#MyAppName}
        AppVersion={#MyAppVersion}
        AppPublisher={#MyAppPublisher}
        AppPublisherURL={#MyAppURL}
        AppSupportURL={#MyAppURL}
        AppUpdatesURL={#MyAppURL}
        DefaultDirName={autopf}\{#MyAppName}
        DefaultGroupName={#MyAppName}
        AllowNoIcons=yes
        OutputDir=Release
        OutputBaseFilename=MicaPDF-Setup-ARM64
        Compression=lzma2
        SolidCompression=yes
        WizardStyle=modern
        ArchitecturesAllowed=arm64
        ArchitecturesInstallIn64BitMode=arm64
        PrivilegesRequired=lowest

        [Languages]
        Name: "english"; MessagesFile: "compiler:Default.isl"

        [Tasks]
        Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

        [Files]
        Source: "bin\ARM64\Release\net10.0-windows10.0.22621.0\win-arm64\publish\MicaPDF.exe"; DestDir: "{app}"; Flags: ignoreversion

        [Icons]
        Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
        Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
        Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

        [Run]
        Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent

        [Registry]
        Root: HKCU; Subkey: "Software\Classes\.pdf"; ValueType: string; ValueName: ""; ValueData: "MicaPDF.Document"; Flags: uninsdeletevalue
        Root: HKCU; Subkey: "Software\Classes\MicaPDF.Document"; ValueType: string; ValueName: ""; ValueData: "PDF Document"; Flags: uninsdeletekey
        Root: HKCU; Subkey: "Software\Classes\MicaPDF.Document\DefaultIcon"; ValueType: string; ValueName: ""; ValueData: "{app}\{#MyAppExeName},0"
        Root: HKCU; Subkey: "Software\Classes\MicaPDF.Document\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\{#MyAppExeName}"" ""%1"""
        "@ | Out-File -FilePath "installer-arm64.iss" -Encoding UTF8
      shell: pwsh
      
    - name: Build Installers
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-x64.iss
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-arm64.iss
      shell: pwsh
      continue-on-error: true
      
    - name: Create Portable ZIP
      run: |
        Compress-Archive -Path "bin\x64\Release\net10.0-windows10.0.22621.0\win-x64\publish\MicaPDF.exe", "Release\INSTALL.txt", "Release\README.md" -DestinationPath "Release\MicaPDF-Portable-x64.zip" -Force
        Compress-Archive -Path "bin\ARM64\Release\net10.0-windows10.0.22621.0\win-arm64\publish\MicaPDF.exe", "Release\INSTALL.txt", "Release\README.md" -DestinationPath "Release\MicaPDF-Portable-ARM64.zip" -Force
      shell: pwsh
      
    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: MicaPDF-Release
        path: |
          Release/*.exe
          Release/*.zip
          Release/*.txt
          Release/*.md
          
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Release/MicaPDF-Portable-x64.zip
          Release/MicaPDF-Portable-ARM64.zip
          Release/MicaPDF-Setup-x64.exe
          Release/MicaPDF-Setup-ARM64.exe
          Release/INSTALL.txt
          Release/README.md
        body: |
          ## MicaPDF
          
          PDF viewer for Windows with Mica backdrop and ink/text annotations.
          
          ### Downloads
          
          **Installer**
          - `MicaPDF-Setup-x64.exe`
          - `MicaPDF-Setup-ARM64.exe`
          
          **Portable**
          - `MicaPDF-Portable-x64.zip`
          - `MicaPDF-Portable-ARM64.zip`
          
          ### Notes
          - Save annotated PDF writes a new PDF with your annotations
          - Windows 10 (build 17763) or later
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
